<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SegaMap — Trajets bus &amp; métro Maurice</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3CclipPath id='c'%3E%3Cpath d='M12 2C7.31 2 3.5 5.81 3.5 10.5C3.5 17 12 22 12 22S20.5 17 20.5 10.5C20.5 5.81 16.69 2 12 2Z'/%3E%3C/clipPath%3E%3C/defs%3E%3Cg clip-path='url(%23c)'%3E%3Crect x='0' y='2' width='24' height='5' fill='%23EA2839'/%3E%3Crect x='0' y='7' width='24' height='5' fill='%231A206D'/%3E%3Crect x='0' y='12' width='24' height='5' fill='%23FFD500'/%3E%3Crect x='0' y='17' width='24' height='5' fill='%2300A551'/%3E%3C/g%3E%3Ccircle cx='12' cy='9.5' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#15181D;
    --ink-soft:#5B6472;
    --bg:#F3F4F6;
    --paper:#FFFFFF;
    --line:#E7E9EC;
    --red:#E24C4B;
    --blue:#3B6FE0;
    --navy:#15181D;
    --shadow: 0 1px 2px rgba(15,20,30,0.05), 0 10px 28px -14px rgba(15,20,30,0.22);
    --shadow-lg: 0 4px 10px rgba(15,20,30,0.08), 0 24px 48px -20px rgba(15,20,30,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  .app{
    max-width:460px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    position:relative;
    background:var(--paper);
    overflow:hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
  }
  .screen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    background:var(--paper);
  }
  .screen.active{display:flex;}

  /* ---------- Top bars ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    z-index:5;
  }
  .topbar.floating{
    position:absolute; top:0; left:0; right:0;
    background:transparent; border-bottom:none;
    padding:16px;
    z-index:1100;
  }
  .icon-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: var(--shadow);
    color:var(--ink);
    flex-shrink:0;
  }
  .icon-btn svg{width:18px;height:18px;}
  .brand{
    font-weight:800;
    font-size:17px;
    letter-spacing:-0.01em;
    display:flex; align-items:center; gap:6px;
  }

  /* ---------- Home screen ---------- */
  #screen-home .map-full{position:absolute; inset:0;}
  .zoom-ctrl{
    position:absolute; right:16px; top:74px;
    display:flex; flex-direction:column;
    background:var(--paper); border-radius:12px; box-shadow:var(--shadow);
    overflow:hidden; z-index:1100;
  }
  .zoom-ctrl button{
    width:38px; height:38px; border:none; background:none; cursor:pointer;
    font-size:18px; color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .zoom-ctrl button:first-child{border-bottom:1px solid var(--line);}
  .geo-status{
    position:absolute; right:16px; top:166px; z-index:1100;
    max-width:calc(100% - 32px);
    padding:8px 11px; border-radius:999px;
    background:rgba(255,255,255,.96); border:1px solid var(--line);
    box-shadow:var(--shadow); color:var(--ink-soft);
    font-size:11px; font-weight:600; line-height:1.25;
    display:none;
  }
  .geo-status.show{display:block;}
  .map-status{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:3; background:rgba(255,255,255,.96); border:1px solid var(--line);
    box-shadow:var(--shadow); border-radius:12px; padding:10px 13px;
    font-size:12px; font-weight:600; color:var(--ink-soft);
    pointer-events:none;
  }
  .map-status.hidden{display:none;}
  .geo-status.ok{color:#17633A;}
  .geo-status.error{color:#8A3B3B;}
  .icon-btn.is-loading{opacity:.65; pointer-events:none;}
  .field-row.geo-selected{border-color:var(--blue); background:#fff;}
  .field-row.geo-selected .field-dot{box-shadow:0 0 0 4px rgba(59,111,224,.12);}
  .locate-inline{
    border:0; background:transparent; color:var(--blue); font:600 11px Inter,sans-serif;
    cursor:pointer; padding:4px 0; white-space:nowrap;
  }

  .sheet{
    position:absolute; left:0; right:0; bottom:0;
    background:var(--paper);
    border-radius:22px 22px 0 0;
    box-shadow: var(--shadow-lg);
    padding:18px 18px 20px;
    z-index:1000;
  }
  .field-row{
    display:flex; align-items:center; gap:10px;
    background:#F4F5F7;
    border:1.5px solid transparent;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:9px;
    position:relative;
  }
  .field-row:focus-within{border-color:var(--blue); background:#fff;}
  .field-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .field-dot.dot-red{background:var(--red);}
  .field-dot.dot-blue{background:var(--blue);}
  .field-row input{
    border:none; background:none; outline:none;
    font-family:'Inter',sans-serif; font-size:14.5px; color:var(--ink);
    flex:1; min-width:0;
  }
  .field-row input::placeholder{color:#9AA3AD;}
  .fields-wrap{position:relative;}
  .swap-btn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:30px; height:30px; border-radius:50%;
    background:var(--paper); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    z-index:2;
  }
  .suggestions{
    position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow-lg); max-height:240px; overflow-y:auto; z-index:30; display:none;
  }
  .suggestions.open{display:block;}
  .sugg-item{padding:10px 14px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid #F0F1F3;}
  .sugg-item:last-child{border-bottom:none;}
  .sugg-item:hover{background:#F4F5F7;}
  .sugg-name{font-size:13.5px; font-weight:500;}
  .sugg-meta{font-size:10.5px; color:#9AA3AD; font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
  .tag-metro{color:var(--blue); font-weight:700;}
  .tag-poi{color:var(--red); font-weight:700;}

  .go-btn{
    width:100%;
    background:var(--navy); color:#fff; border:none;
    font-family:'Inter',sans-serif; font-weight:700; font-size:15px;
    padding:14px; border-radius:12px; cursor:pointer; margin-top:6px;
  }
  .go-btn:active{opacity:0.85;}
  .sheet-footer{
    text-align:center; margin-top:12px;
    font-size:11px; color:#9AA3AD; line-height:1.6;
  }

  /* ---------- Overview screen ---------- */
  .ov-title-block{padding:14px 18px 4px;}
  .ov-title{font-size:16.5px; font-weight:700; line-height:1.35;}
  .ov-subtitle{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

  .icon-summary-row{
    display:flex; align-items:center; gap:8px;
    padding:14px 18px 12px;
    overflow-x:auto;
  }
  .is-item{display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0;}
  .is-circle{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
  }
  .is-circle svg{width:16px;height:16px;}
  .is-value{font-size:10.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .is-arrow{color:#C7CBD1; font-size:15px; margin:0 -1px;}
  .is-total{
    margin-left:auto; flex-shrink:0;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px;
    color:var(--ink); background:#F4F5F7; padding:8px 12px; border-radius:12px;
    white-space:nowrap;
  }

  .map-wrap{position:relative; margin:0 18px; border-radius:16px; overflow:hidden; border:1px solid var(--line);}
  .map-wrap .leaflet-container{height:220px;}
  .recenter-btn{
    position:absolute; right:10px; bottom:10px; z-index:400;
    background:#fff; border:none; border-radius:10px; box-shadow:var(--shadow);
    padding:8px 12px; font-size:12px; font-weight:600; color:var(--ink);
    display:flex; align-items:center; gap:6px; cursor:pointer;
  }
  .recenter-btn svg{width:13px;height:13px;}

  .steps-header{
    padding:16px 18px 4px;
    font-size:11px; color:#9AA3AD; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
  }
  .steps-hint{padding:0 18px 8px; font-size:12px; color:var(--ink-soft);}

  .steps-scroll{flex:1; overflow-y:auto; padding-bottom:24px;}

  .step-card{
    display:flex; align-items:flex-start; gap:12px;
    margin:0 18px 10px;
    padding:13px 14px;
    background:#F9FAFB;
    border-radius:14px;
    cursor:pointer;
    transition: background .12s ease;
  }
  .step-card:active{background:#EEF0F3;}
  .step-card.pin-card{background:none; padding:6px 14px;}
  .step-icon{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .step-icon svg{width:15px;height:15px;}
  .step-body{min-width:0; flex:1;}
  .step-title{font-size:14px; font-weight:700; margin:0 0 2px; line-height:1.3;}
  .step-route{font-size:12.5px; color:var(--ink-soft); margin:0 0 3px; line-height:1.4;}
  .step-meta{font-size:11.5px; color:#9AA3AD; font-family:'IBM Plex Mono',monospace;}
  .step-chevron{color:#C7CBD1; flex-shrink:0; margin-top:8px;}
  .step-chevron svg{width:14px;height:14px;}

  .fallback-banner{
    margin:10px 18px 0;
    padding:11px 13px;
    background:#FEF3E2;
    border:1px solid #F5DBA8;
    border-radius:12px;
    font-size:12px; color:#7A5A16; line-height:1.5;
    display:flex; gap:9px; align-items:flex-start;
  }
  .fallback-banner svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}

  /* ---------- Detail screen ---------- */
  .detail-title-block{padding:16px 18px 2px;}
  .detail-title{font-size:19px; font-weight:800; line-height:1.3;}
  .detail-subtitle{font-size:13px; color:var(--ink-soft); margin-top:3px;}

  .stat-row{
    display:flex; gap:10px;
    padding:14px 18px 6px;
  }
  .stat-chip{
    display:flex; align-items:center; gap:6px;
    background:#F4F5F7; border-radius:10px; padding:8px 11px;
    font-size:12.5px; font-weight:600; color:var(--ink);
  }
  .stat-chip svg{width:14px;height:14px;color:var(--ink-soft);}

  .detail-map-wrap{position:relative; margin:14px 18px; border-radius:16px; overflow:hidden; border:1px solid var(--line);}
  .detail-map-wrap .leaflet-container{height:230px;}
  .map-callout{
    position:absolute; top:10px; left:10px; right:10px; z-index:400;
    background:#fff; border-radius:12px; box-shadow:var(--shadow);
    padding:9px 12px;
  }
  .map-callout .cal-label{font-size:10px; color:#9AA3AD; text-transform:uppercase; letter-spacing:.04em; font-weight:700;}
  .map-callout .cal-name{font-size:13.5px; font-weight:700; margin-top:1px;}

  .detail-instructions{padding:4px 18px 20px;}
  .instr-text{font-size:13.5px; line-height:1.65; color:var(--ink);}
  .lines-served{margin-top:12px;}
  .lines-served .lbl{font-size:11.5px; color:var(--ink-soft); margin-bottom:7px;}
  .line-chip-row{display:flex; flex-wrap:wrap; gap:7px;}
  .line-chip-badge{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px;
    border:1.5px solid var(--line); border-radius:8px; padding:4px 9px; color:var(--ink);
  }

  @media (max-width:480px){
    .app{max-width:100%; box-shadow:none;}
  }
</style>
</head>
<body>
<!-- Shared SVG defs: Mauritius-flag pin logo, referenced by every "brand" element -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="pinClip" clipPathUnits="userSpaceOnUse">
      <path d="M12 2C7.31 2 3.5 5.81 3.5 10.5C3.5 17 12 22 12 22S20.5 17 20.5 10.5C20.5 5.81 16.69 2 12 2Z"/>
    </clipPath>
  </defs>
</svg>
<div class="app">

  <!-- ============ SCREEN 1 : HOME ============ -->
  <div class="screen active" id="screen-home">
    <div id="home-map" class="map-full"></div>
    <div class="topbar floating">
      <button class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="brand" style="background:#fff;padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);"><svg viewBox="0 0 24 24" width="18" height="18" style="flex-shrink:0;"><g clip-path="url(#pinClip)"><rect x="0" y="2" width="24" height="5" fill="#EA2839"/><rect x="0" y="7" width="24" height="5" fill="#1A206D"/><rect x="0" y="12" width="24" height="5" fill="#FFD500"/><rect x="0" y="17" width="24" height="5" fill="#00A551"/></g><circle cx="12" cy="9.5" r="3" fill="#fff"/></svg>SegaMap</div>
      <button class="icon-btn" id="locate-btn" aria-label="Ma position" title="Ma position" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
    <div class="zoom-ctrl">
      <button id="zoom-in" type="button" aria-label="Zoom avant">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom arrière">−</button>
    </div>
    <div id="geo-status" class="geo-status" role="status" aria-live="polite"></div>
    <div id="map-status" class="map-status">Chargement de la carte…</div>

    <div class="sheet">
      <div class="fields-wrap">
        <div class="field-row">
          <span class="field-dot dot-red"></span>
          <input id="origin-input" type="text" placeholder="Ma position" autocomplete="off" aria-label="Point de départ">
          <button class="locate-inline" id="use-position-btn" type="button">Utiliser</button>
        </div>
        <div class="field-row">
          <span class="field-dot dot-blue"></span>
          <input id="dest-input" type="text" placeholder="Où allez-vous ?" autocomplete="off" aria-label="Destination">
        </div>
        <button class="swap-btn" id="swap-btn" title="Inverser" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>
        </button>
        <div class="suggestions" id="origin-sugg"></div>
        <div class="suggestions" id="dest-sugg"></div>
      </div>
      <button class="go-btn" id="go-btn" type="button">GO</button>
      <div class="sheet-footer" id="footer-stats">Réseau mauricien</div>
    </div>
  </div>

  <!-- ============ SCREEN 2 : OVERVIEW + STEPS ============ -->
  <div class="screen" id="screen-overview">
    <div class="topbar">
      <button class="icon-btn" id="back-to-home" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand"><svg viewBox="0 0 24 24" width="18" height="18" style="flex-shrink:0;"><g clip-path="url(#pinClip)"><rect x="0" y="2" width="24" height="5" fill="#EA2839"/><rect x="0" y="7" width="24" height="5" fill="#1A206D"/><rect x="0" y="12" width="24" height="5" fill="#FFD500"/><rect x="0" y="17" width="24" height="5" fill="#00A551"/></g><circle cx="12" cy="9.5" r="3" fill="#fff"/></svg>SegaMap</div>
      <button class="icon-btn" aria-label="Partager">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>
      </button>
    </div>
    <div class="steps-scroll">
      <div class="ov-title-block">
        <div class="ov-title" id="ov-title">Départ → Arrivée</div>
        <div class="ov-subtitle">Aperçu de tout votre trajet</div>
      </div>
      <div id="fallback-banners"></div>
      <div class="icon-summary-row" id="icon-summary-row"></div>
      <div class="map-wrap">
        <div id="overview-map"></div>
        <button class="recenter-btn" id="recenter-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          Recentrer
        </button>
      </div>
      <div class="steps-header">Aperçu du trajet</div>
      <div class="steps-hint">Appuie sur une étape pour voir le détail</div>
      <div id="steps-list"></div>
    </div>
  </div>

  <!-- ============ SCREEN 3 : STEP DETAIL ============ -->
  <div class="screen" id="screen-detail">
    <div class="topbar">
      <button class="icon-btn" id="back-to-overview" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand"><svg viewBox="0 0 24 24" width="18" height="18" style="flex-shrink:0;"><g clip-path="url(#pinClip)"><rect x="0" y="2" width="24" height="5" fill="#EA2839"/><rect x="0" y="7" width="24" height="5" fill="#1A206D"/><rect x="0" y="12" width="24" height="5" fill="#FFD500"/><rect x="0" y="17" width="24" height="5" fill="#00A551"/></g><circle cx="12" cy="9.5" r="3" fill="#fff"/></svg>SegaMap</div>
      <button class="icon-btn" aria-label="Partager">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>
      </button>
    </div>
    <div class="steps-scroll">
      <div class="detail-title-block">
        <div class="detail-title" id="detail-title">—</div>
        <div class="detail-subtitle" id="detail-subtitle">—</div>
      </div>
      <div class="stat-row" id="detail-stats"></div>
      <div class="detail-map-wrap">
        <div class="map-callout" id="detail-callout" style="display:none;">
          <div class="cal-label">Arrêt le plus proche</div>
          <div class="cal-name" id="detail-callout-name">—</div>
        </div>
        <div id="detail-map"></div>
      </div>
      <div class="detail-instructions">
        <p class="instr-text" id="detail-instr">—</p>
        <div class="lines-served" id="detail-lines" style="display:none;">
          <div class="lbl">Cet arrêt est desservi par les lignes</div>
          <div class="line-chip-row" id="detail-lines-chips"></div>
        </div>
      </div>
    </div>
  </div>

    var picked = candidates.filter(function(c){return c.d<=(radius||1600);}).slice(0,3);
    if(picked.length===0 && candidates.length) picked = [candidates[0]];
    picked.forEach(function(c){
      addEdge(nodeId, c.id, 'walk', null, (c.d*DETOUR_FACTOR)/WALK_SPEED_M_MIN);
    });
  }
  (DATA.landmarks||[]).forEach(function(lm){
    var poiId = 'poi:'+lm.name;
    connectExtraNode(poiId, lm.lat, lm.lon, 1600);

  var WAIT_BUS = 8, WAIT_METRO = 5;
  function modeKey(mode, line){ return mode==='walk' ? 'walk' : (mode+'|'+(line||'')); }

  function shortestPath(startId, endId){
    if(!nodes[startId] || !nodes[endId]) return null;
    var startState = startId+'::start';
    var dist = {}; dist[startState] = 0;
    var prev = {};
    var visited = {};
    var queue = [{state:startState, node:startId, mk:'start', d:0}];
    function popMin(){
      var bi=0;
      for(var i=1;i<queue.length;i++) if(queue[i].d < queue[bi].d) bi=i;
      return queue.splice(bi,1)[0];
    }
    while(queue.length){
      var cur = popMin();
      if(visited[cur.state]) continue;
      visited[cur.state] = true;
      if(cur.node === endId) return reconstruct(cur.state, prev, dist);
      var edges = adj[cur.node] || [];
      for(var i=0;i<edges.length;i++){
        var e = edges[i];
        if(e.mode === 'walk' && cur.mk === 'walk') continue;
        var eMk = modeKey(e.mode, e.line);
        var boarding = 0;
        if(e.mode !== 'walk' && eMk !== cur.mk){ boarding = (e.mode==='metro' ? WAIT_METRO : WAIT_BUS); }
        var nd = cur.d + e.weight + boarding;
        var nState = e.to+'::'+eMk;
        if(dist[nState] === undefined || nd < dist[nState]){
          dist[nState] = nd;
          prev[nState] = {from: cur.state, edge: e, boarding: boarding};
          queue.push({state:nState, node:e.to, mk:eMk, d:nd});
        }
      }
    }
    return null;
  }
  function reconstruct(finalState, prev, dist){
    var chain = []; var s = finalState;
    while(prev[s]){ chain.push({edge: prev[s].edge, boarding: prev[s].boarding}); s = prev[s].from; }
    chain.reverse();
    return {totalMin: dist[finalState], chain: chain};
  }
  function nearestAlternatives(fromId, limit){
    var from = nodes[fromId];
    var list = [];
    Object.keys(nodes).forEach(function(id){
      if(id === fromId) return;
      var n = nodes[id];
      list.push({id:id, d: haversineM(from.lat, from.lon, n.lat, n.lon)});
    });
    list.sort(function(a,b){return a.d-b.d;});
    return list.slice(0, limit);
  }
  function routeWithFallback(oid, did){
    var direct = shortestPath(oid, did);
    if(direct) return {result:direct, actualStart:oid, actualEnd:did, startWalk:0, endWalk:0};
    var CANDIDATES = 10;
    var altOrigins = nearestAlternatives(oid, CANDIDATES);
    var altDests = nearestAlternatives(did, CANDIDATES);
    for(var i=0;i<altOrigins.length;i++){
      var r = shortestPath(altOrigins[i].id, did);
      if(r) return {result:r, actualStart:altOrigins[i].id, actualEnd:did, startWalk:(altOrigins[i].d*DETOUR_FACTOR)/WALK_SPEED_M_MIN, endWalk:0};
    }
    for(var j=0;j<altDests.length;j++){
      var r2 = shortestPath(oid, altDests[j].id);
      if(r2) return {result:r2, actualStart:oid, actualEnd:altDests[j].id, startWalk:0, endWalk:(altDests[j].d*DETOUR_FACTOR)/WALK_SPEED_M_MIN};
    }
    var best = null;
    for(var i2=0;i2<Math.min(5,altOrigins.length);i2++){
      for(var j2=0;j2<Math.min(5,altDests.length);j2++){
        var r3 = shortestPath(altOrigins[i2].id, altDests[j2].id);
        if(r3){
          var wA = (altOrigins[i2].d*DETOUR_FACTOR)/WALK_SPEED_M_MIN;
          var wB = (altDests[j2].d*DETOUR_FACTOR)/WALK_SPEED_M_MIN;
          var total = r3.totalMin + wA + wB;
          if(!best || total < best.total) best = {total:total, result:r3, actualStart:altOrigins[i2].id, actualEnd:altDests[j2].id, startWalk:wA, endWalk:wB};
        }
      }
    }
    return best;
  }
  function buildLegs(startId, result){
    var legs = []; var curNode = startId; var curLeg = null;
    result.chain.forEach(function(step){
      var e = step.edge;
      var mk = modeKey(e.mode, e.line);
      if(curLeg && curLeg.mk === mk){
        curLeg.to = e.to; curLeg.rideMin += e.weight; curLeg.stops += 1;
      } else {
        if(curLeg) legs.push(curLeg);
        curLeg = {mode:e.mode, line:e.line, mk:mk, from:curNode, to:e.to, rideMin:e.weight, waitMin:step.boarding, stops:1};
      }
      curNode = e.to;
    });
    if(curLeg) legs.push(curLeg);
    return legs;
  }

  function fmtMin(m){

  function bearingDirection(lat1, lon1, lat2, lon2){
    var toRad = Math.PI/180, toDeg = 180/Math.PI;
    var dLon = (lon2-lon1)*toRad;
    var y = Math.sin(dLon)*Math.cos(lat2*toRad);
    var x = Math.cos(lat1*toRad)*Math.sin(lat2*toRad) - Math.sin(lat1*toRad)*Math.cos(lat2*toRad)*Math.cos(dLon);
    var brng = (Math.atan2(y,x)*toDeg + 360) % 360;
    var dirs = ['nord','nord-est','est','sud-est','sud','sud-ouest','ouest','nord-ouest'];
    return dirs[Math.round(brng/45) % 8];
  }

  function setupGeolocation(recenter){
    if(geoBusy) return;

    if(!window.isSecureContext){
      setGeoStatus('La localisation nécessite HTTPS (ou localhost).', 'error');

    if(!navigator.geolocation){

      return;

    geoBusy = true;
    locateBtn.classList.add('is-loading');
    setGeoStatus('Localisation en cours…');

    navigator.geolocation.getCurrentPosition(function(pos){
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      var accuracy = pos.coords.accuracy || 100;

      addNode(GEO_NODE_ID, 'Ma position', 'geo', 'Localisation actuelle', lat, lon);
      nodes[GEO_NODE_ID].accuracy = accuracy;

      // Rebuild only the temporary GPS connections so route calculations use
      // the newest position rather than a stale fix.
      adj[GEO_NODE_ID] = [];
      connectExtraNode(GEO_NODE_ID, lat, lon, Math.max(1600, accuracy * 3));

      geoReady = true;
      if(allNodesList.indexOf(nodes[GEO_NODE_ID]) === -1) allNodesList.unshift(nodes[GEO_NODE_ID]);

      useGeoAsOrigin();
      placeGeoMarker(homeMap, lat, lon, accuracy);

      if(recenter) homeMap.setView([lat, lon], 16);
      setGeoStatus('Position trouvée · précision ~'+Math.round(accuracy)+' m', 'ok');

  function searchNodes(query){
    query = query.trim().toLowerCase();
    if(!query) return [];
    var starts=[], contains=[];
    allNodesList.forEach(function(n){
      var name = n.name.toLowerCase();
      var area = (n.area || '').toLowerCase();
      if(name.indexOf(query)===0 || area.indexOf(query)===0) starts.push(n);
      else if(name.indexOf(query)!==-1 || area.indexOf(query)!==-1) contains.push(n);
    });
    return starts.concat(contains).slice(0,6);
  }

  function searchPlacesOnline(query){
    var clean = query.trim();
    if(clean.length < 3) return Promise.resolve([]);
    var key = clean.toLowerCase();
    if(geocodeCache[key]) return Promise.resolve(geocodeCache[key]);

    var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=mu&addressdetails=1&q=' + encodeURIComponent(clean);
    return fetch(url, {headers:{'Accept':'application/json'}})
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(items){
        var results = items.map(function(item, i){
          var id = 'geo:search:'+key+':'+i;
          var area = item.display_name || 'Maurice';
          addNode(id, item.display_name, 'poi', area, Number(item.lat), Number(item.lon));
          nodes[id].onlineSearch = true;
          return nodes[id];
        });
        geocodeCache[key] = results;
        results.forEach(function(n){ if(allNodesList.indexOf(n)===-1) allNodesList.push(n); });
        return results;
      })
      .catch(function(){ return []; });
  }

  function combinedSearch(query){
    var local = searchNodes(query);

      var seen = {};
      var merged = [];
      local.concat(remote).forEach(function(n){
        if(!seen[n.id]){ seen[n.id]=true; merged.push(n); }
      });
      return merged.slice(0,8);
    });
  }

    legs.forEach(function(l, idx){
      var color = legColor(idx);
      rowHtml += '<div class="is-item"><div class="is-circle" style="background:'+color+'">'+ICONS[l.mode]+'</div><div class="is-value">'+(l.mode==='walk'?fmtMin(l.rideMin):(l.line||'M'))+'</div></div>';
      if(idx < legs.length-1) rowHtml += '<div class="is-arrow">›</div>';
    });
    rowHtml += '<div class="is-total">≈ '+fmtMin(total)+'</div>';
    row.innerHTML = rowHtml;

    // Steps list
    var stepsList = document.getElementById('steps-list');
    var html = '';
    html += stepCardPin(origin.name, origin.area);
    var legIdx = 0;
    trip.displaySteps.forEach(function(item){
      if(item.isTransfer){
        html += stepCardTransfer(nodes[item.at].name, item.waitMin);
      } else {
        html += stepCardLeg(item, legIdx, legColor(legIdx));
        legIdx++;
      }
    });
    html += stepCardPin(dest.name, dest.area);
    stepsList.innerHTML = html;

    // wire clicks
    Array.prototype.forEach.call(stepsList.querySelectorAll('.step-card[data-leg]'), function(el){
      el.addEventListener('click', function(){
        openDetail(parseInt(el.dataset.leg, 10));
      });
    });

    renderOverviewMap();
  }

  function stepCardPin(name, area){
    return '<div class="step-card pin-card"><div class="step-icon" style="background:var(--navy)">'+ICONS.pin+'</div>'+
      '<div class="step-body"><p class="step-title">'+escapeHtml(name)+'</p><p class="step-route">'+escapeHtml(area)+'</p></div></div>';
  }
  function stepCardTransfer(atName, waitMin){
    return '<div class="step-card" style="background:none;cursor:default;">'+
      '<div class="step-icon" style="background:#B9BFC8">'+ICONS.transfer+'</div>'+
      '<div class="step-body"><p class="step-title">Correspondance</p>'+
      '<p class="step-route">'+escapeHtml(atName)+'</p>'+
      '<p class="step-meta">Temps d\u2019attente estimé : ~'+Math.round(waitMin)+' min</p></div></div>';
  }
  function stepCardLeg(l, legIdx, color){
    var title, route, meta;
    if(l.mode === 'walk'){
      title = 'Marcher jusqu\u2019à l\u2019arrêt';
      route = escapeHtml(nodes[l.from].name)+' → '+escapeHtml(nodes[l.to].name);
      meta = fmtMin(l.rideMin)+(l.isFallback ? ' · arrêt le plus proche connecté' : ' à pied');
    } else if(l.mode === 'bus'){
      title = 'Ligne '+escapeHtml(l.line);
      route = escapeHtml(nodes[l.from].name)+' → '+escapeHtml(nodes[l.to].name);
      meta = (l.stops>1?(l.stops+' tronçons · '):'')+'~'+fmtMin(l.rideMin);
    } else {
      title = 'Metro Express';
      route = escapeHtml(nodes[l.from].name)+' → '+escapeHtml(nodes[l.to].name);
      meta = (l.stops>1?(l.stops+' arrêts · '):'1 arrêt · ')+'~'+fmtMin(l.rideMin);
    }
    return '<div class="step-card" data-leg="'+legIdx+'">'+
      '<div class="step-icon" style="background:'+color+'">'+ICONS[l.mode]+'</div>'+
      '<div class="step-body"><p class="step-title">'+title+'</p><p class="step-route">'+route+'</p><p class="step-meta">'+meta+'</p></div>'+
      '<div class="step-chevron">'+ICONS.chevron+'</div></div>';
  }

  function nodeLatLng(id){ var n=nodes[id]; return [n.lat, n.lon]; }

  // ================= Real street-following geometry (progressive enhancement) =================
  // Straight/metro-sequence lines render immediately; if a live routing service answers,
  // the segment is swapped for the real walked/driven street path.
  var roadRouteCache = {};
  function fetchRoadRoute(fromId, toId, profile){
    var key = profile+'|'+fromId+'|'+toId;
    if(roadRouteCache[key]) return roadRouteCache[key];
    var a = nodes[fromId], b = nodes[toId];
    var url = 'https://router.project-osrm.org/route/v1/'+profile+'/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=full&geometries=geojson';
    var p = fetch(url).then(function(r){ return r.ok ? r.json() : null; }).then(function(data){
      if(data && data.routes && data.routes[0]){
        return data.routes[0].geometry.coordinates.map(function(c){ return [c[1], c[0]]; });
      }
      return null;
    }).catch(function(){ return null; });
    roadRouteCache[key] = p;
    return p;
  }
  // Only walk and bus legs benefit (metro follows a fixed rail alignment already drawn
  // through its real stations; a road profile would be misleading for it).
  function enhanceLegWithRoadRoute(leg, polylineLayer, map, onUpdate){
    if(leg.mode !== 'walk' && leg.mode !== 'bus') return;
    var profile = leg.mode === 'walk' ? 'foot' : 'driving';
    fetchRoadRoute(leg.from, leg.to, profile).then(function(pts){
      if(!pts || pts.length < 2) return;
      polylineLayer.setLatLngs(pts);
      if(onUpdate) onUpdate(pts);
    });
  }


  function renderOverviewMap(){
    var el = document.getElementById('overview-map');
    if(overviewMap){ overviewMap.remove(); overviewMap=null; }
    overviewMap = L.map(el, {scrollWheelZoom:false, attributionControl:false});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {maxZoom:19, detectRetina:true}).addTo(overviewMap);

    var allPts = [];
    overviewLegLayers = [];
    trip.legs.forEach(function(l, idx){
      var latlngs = legPolylinePoints(l);
      var dash = l.mode==='walk' ? '2,8' : null;
      var line = L.polyline(latlngs, {color: legColor(idx), weight: l.mode==='walk'?4:5, opacity:0.92, dashArray:dash, lineCap:'round'}).addTo(overviewMap);
      overviewLegLayers.push(line);
      latlngs.forEach(function(p){allPts.push(p);});
      enhanceLegWithRoadRoute(l, line, overviewMap);
    });
    L.circleMarker(nodeLatLng(trip.oid), {radius:8, color:'#15181D', weight:2.5, fillColor:'#E24C4B', fillOpacity:1}).addTo(overviewMap);
    L.circleMarker(nodeLatLng(trip.did), {radius:8, color:'#15181D', weight:2.5, fillColor:'#3B6FE0', fillOpacity:1}).addTo(overviewMap);
    trip.legs.forEach(function(l, idx){
      if(idx < trip.legs.length-1){
        L.circleMarker(nodeLatLng(l.to), {radius:5, color: legColor(idx+1), weight:2, fillColor:'#fff', fillOpacity:1}).addTo(overviewMap);
      }
    });
    if(trip.oid === GEO_NODE_ID && geoReady){
      var gn = nodes[GEO_NODE_ID];
      placeGeoMarker(overviewMap, gn.lat, gn.lon, gn.accuracy || 100);
    }
    allPts.push(nodeLatLng(trip.oid), nodeLatLng(trip.did));
    if(allPts.length) overviewMap.fitBounds(allPts, {padding:[24,24]});

    document.getElementById('recenter-btn').onclick = function(){
      if(allPts.length) overviewMap.fitBounds(allPts, {padding:[24,24]});
    };
  }

  function legPolylinePoints(l){
    if(l.mode === 'metro'){
      var order = metroSorted.map(function(s){return 'metro:'+s.name;});
      var ia = order.indexOf(l.from), ib = order.indexOf(l.to);
      if(ia>-1 && ib>-1){
        var lo=Math.min(ia,ib), hi=Math.max(ia,ib);
        var slice = order.slice(lo, hi+1);
        if(ia>ib) slice.reverse();
        return slice.map(nodeLatLng);
      }
    }
    return [nodeLatLng(l.from), nodeLatLng(l.to)];
  }

  // ================= Detail screen =================
  var detailMap = null;

  function linesServedAt(nodeId){
    var lines = [];
    (DATA.busLines||[]).forEach(function(e){
      if(e.a === nodeId || e.b === nodeId){ if(lines.indexOf(e.line) === -1) lines.push(e.line); }
    });
    return lines;
  }

  function openDetail(legIdx){
    var l = trip.legs[legIdx];
    var color = legColor(legIdx);
    var titleEl = document.getElementById('detail-title');
    var subEl = document.getElementById('detail-subtitle');
    var statsEl = document.getElementById('detail-stats');
    var calloutEl = document.getElementById('detail-callout');
    var calloutNameEl = document.getElementById('detail-callout-name');
    var instrEl = document.getElementById('detail-instr');
    var linesEl = document.getElementById('detail-lines');
    var linesChipsEl = document.getElementById('detail-lines-chips');

    if(l.mode === 'walk'){
      var distM = (l.rideMin * WALK_SPEED_M_MIN) / DETOUR_FACTOR;
      titleEl.textContent = 'Marcher jusqu\u2019à l\u2019arrêt';
      subEl.textContent = nodes[l.from].name+' → '+nodes[l.to].name;
      statsEl.innerHTML =
        statChip(ICONS.clock, fmtMin(l.rideMin)) +
        statChip(ICONS.ruler, fmtDist(distM)) +
        statChip(ICONS.gauge, walkDifficulty(distM));
      calloutEl.style.display = 'block';
      calloutNameEl.textContent = nodes[l.to].name;
      var dir = bearingDirection(nodes[l.from].lat, nodes[l.from].lon, nodes[l.to].lat, nodes[l.to].lon);
      instrEl.textContent = 'Marchez en direction du '+dir+' jusqu\u2019à '+(nodes[l.to].type==='metro'?'la station':'l\u2019arrêt')+' '+nodes[l.to].name+'.'+
        (l.isFallback ? ' Cet arrêt n\u2019a pas de correspondance directe documentée depuis votre point de départ exact — c\u2019est le point connecté le plus proche.' : '');
      var lines = nodes[l.to].type === 'metro' ? ['Metro Express'] : linesServedAt(l.to);
      if(lines.length){
        linesEl.style.display = 'block';
        linesChipsEl.innerHTML = lines.map(function(ln){return '<span class="line-chip-badge">'+escapeHtml(ln)+'</span>';}).join('');
      } else {
        linesEl.style.display = 'none';
      }
    } else if(l.mode === 'bus'){
      titleEl.textContent = 'Ligne '+l.line;
      subEl.textContent = nodes[l.from].name+' → '+nodes[l.to].name;
      statsEl.innerHTML =
        statChip(ICONS.clock, '~'+fmtMin(l.rideMin)) +
        statChip(ICONS.transfer, 'Attente ~'+Math.round(l.waitMin)+' min') +
        statChip(ICONS.bus, (l.stops>1?l.stops+' tronçons':'direct'));
      calloutEl.style.display = 'none';
      instrEl.textContent = 'Prenez le bus de la ligne '+l.line+' à '+nodes[l.from].name+' en direction de '+nodes[l.to].name+'. Trajet estimé à partir de la distance réelle du tracé officiel NLTA — sans horaire garanti.';
      linesEl.style.display = 'none';
    } else {
      titleEl.textContent = 'Metro Express';
      subEl.textContent = nodes[l.from].name+' → '+nodes[l.to].name;
      statsEl.innerHTML =
        statChip(ICONS.clock, '~'+fmtMin(l.rideMin)) +
        statChip(ICONS.transfer, 'Attente ~'+Math.round(l.waitMin)+' min') +
        statChip(ICONS.metro, (l.stops>1?l.stops+' arrêts':'1 arrêt'));
      calloutEl.style.display = 'none';
      instrEl.textContent = 'Prenez le Metro Express à '+nodes[l.from].name+' en direction de '+nodes[l.to].name+'.';
      linesEl.style.display = 'none';
    }

    showScreen('detail');
    renderDetailMap(l, color);
  }

  function statChip(icon, label){
    return '<div class="stat-chip">'+icon+'<span>'+label+'</span></div>';
  }

  function renderDetailMap(l, color){
    var el = document.getElementById('detail-map');
    if(detailMap){ detailMap.remove(); detailMap=null; }
    detailMap = L.map(el, {scrollWheelZoom:false, attributionControl:false});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {maxZoom:19, detectRetina:true}).addTo(detailMap);
    var latlngs = legPolylinePoints(l);
    var dash = l.mode==='walk' ? '4,10' : null;
    var poly = L.polyline(latlngs, {color:color, weight: l.mode==='walk'?4.5:5.5, opacity:0.95, dashArray:dash, lineCap:'round'}).addTo(detailMap);
    L.circleMarker(nodeLatLng(l.from), {radius:7, color:'#15181D', weight:2, fillColor:'#fff', fillOpacity:1}).addTo(detailMap);
    L.circleMarker(nodeLatLng(l.to), {radius:7, color:'#15181D', weight:2, fillColor:color, fillOpacity:1}).addTo(detailMap);
    detailMap.fitBounds(latlngs, {padding:[36,36]});
    enhanceLegWithRoadRoute(l, poly, detailMap, function(pts){
      detailMap.fitBounds(pts, {padding:[36,36]});
    });
  }

})();

</script>
</body>
</html>
