<style>
  :root{--ink:#15181D;--ink-soft:#5B6472;--bg:#F3F4F6;--paper:#FFFFFF;--line:#E7E9EC;--red:#E24C4B;--blue:#3B6FE0;--navy:#15181D;--shadow:0 1px 2px rgba(15,20,30,0.05),0 10px 28px -14px rgba(15,20,30,0.22);--shadow-lg:0 4px 10px rgba(15,20,30,0.08),0 24px 48px -20px rgba(15,20,30,0.28)}
  *{box-sizing:border-box} html,body{margin:0;padding:0;height:100%} body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  .app{max-width:460px;margin:0 auto;height:100vh;height:100dvh;position:relative;background:var(--paper);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.08)}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--paper)} .screen.active{display:flex}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--paper);border-bottom:1px solid var(--line);flex-shrink:0;z-index:1100}
  .topbar.floating{position:absolute;top:0;left:0;right:0;background:transparent;border-bottom:none;padding:16px;z-index:1100}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);flex-shrink:0}.icon-btn svg{width:18px;height:18px}.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
  #screen-home .map-full{position:absolute;inset:0}.zoom-ctrl{position:absolute;right:16px;top:74px;display:flex;flex-direction:column;background:var(--paper);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:1001}.zoom-ctrl button{width:38px;height:38px;border:none;background:none;cursor:pointer;font-size:18px;color:var(--ink);display:flex;align-items:center;justify-content:center}.zoom-ctrl button:first-child{border-bottom:1px solid var(--line)}
  .geo-status{position:absolute;right:16px;top:166px;z-index:1002;max-width:calc(100% - 32px);padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.96);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink-soft);font-size:11px;font-weight:600;line-height:1.25;display:none}.geo-status.show{display:block}.map-status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;background:rgba(255,255,255,.96);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:10px 13px;font-size:12px;font-weight:600;color:var(--ink-soft);pointer-events:none}.map-status.hidden{display:none}.geo-status.ok{color:#17633A}.geo-status.error{color:#8A3B3B}.icon-btn.is-loading{opacity:.65;pointer-events:none}.field-row.geo-selected{border-color:var(--blue);background:#fff}.field-row.geo-selected .field-dot{box-shadow:0 0 0 4px rgba(59,111,224,.12)}.locate-inline{border:0;background:transparent;color:var(--blue);font:600 11px Inter,sans-serif;cursor:pointer;padding:4px 0;white-space:nowrap}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);padding:18px 18px 20px;z-index:1000}.field-row{display:flex;align-items:center;gap:10px;background:#F4F5F7;border:1.5px solid transparent;border-radius:12px;padding:12px 14px;margin-bottom:9px;position:relative}.field-row:focus-within{border-color:var(--blue);background:#fff}.field-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}.field-dot.dot-red{background:var(--red)}.field-dot.dot-blue{background:var(--blue)}.field-row input{border:none;background:none;outline:none;font-family:'Inter',sans-serif;font-size:14.5px;color:var(--ink);flex:1;min-width:0}.field-row input::placeholder{color:#9AA3AD}.fields-wrap{position:relative}.swap-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}.suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);max-height:240px;overflow-y:auto;z-index:1010;display:none}.suggestions.open{display:block}.sugg-item{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #F0F1F3}.sugg-item:last-child{border-bottom:none}.sugg-item:hover{background:#F4F5F7}.sugg-name{font-size:13.5px;font-weight:500}.sugg-meta{font-size:10.5px;color:#9AA3AD;font-family:'IBM Plex Mono',monospace;white-space:nowrap}.tag-metro{color:var(--blue);font-weight:700}.tag-poi{color:var(--red);font-weight:700}
  .go-btn{width:100%;background:var(--navy);color:#fff;border:none;font-family:'Inter',sans-serif;font-weight:700;font-size:15px;padding:14px;border-radius:12px;cursor:pointer;margin-top:6px}.go-btn:active{opacity:.85}.sheet-footer{text-align:center;margin-top:12px;font-size:11px;color:#9AA3AD;line-height:1.6}
</style>
