name: Fix SegaMap map layering

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-map-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the search sheet above Leaflet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('z-index:6;\n  }\n  .field-row{', 'z-index:1000;\n  }\n  .field-row{', 1)
          s = s.replace('position:absolute; inset:0;\n    display:none;', 'position:absolute; inset:0;\n    display:none;', 1)
          s = s.replace('position:absolute; top:0; left:0; right:0;\n    background:transparent; border-bottom:none;\n    padding:16px;\n  }', 'position:absolute; top:0; left:0; right:0;\n    background:transparent; border-bottom:none;\n    padding:16px;\n    z-index:1100;\n  }', 1)
          s = s.replace('overflow:hidden; z-index:4;\n  }', 'overflow:hidden; z-index:1100;\n  }', 1)
          s = s.replace('max-width:calc(100% - 32px);\n    padding:8px 11px;', 'max-width:calc(100% - 32px);\n    padding:8px 11px;', 1)
          s = s.replace('position:absolute; right:16px; top:166px; z-index:5;', 'position:absolute; right:16px; top:166px; z-index:1100;', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix map layering and search panel"
            git push
          fi
