name: Deploy SegaMap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare SegaMap v3.0
        run: |
          perl -0pi -e 's/SegaMap v1\.2/SegaMap v3.0/g; s/SegaMap v1\.3/SegaMap v3.0/g; s/SegaMap v1\.4/SegaMap v3.0/g; s/SegaMap v1\.5/SegaMap v3.0/g; s/SegaMap v1\.6/SegaMap v3.0/g; s/SegaMap v1\.7/SegaMap v3.0/g; s/SegaMap v1\.8/SegaMap v3.0/g; s/SegaMap v2\.0/SegaMap v3.0/g; s/SegaMap v2\.1/SegaMap v3.0/g; s/SegaMap v2\.2/SegaMap v3.0/g; s/tronçons/arrêts/g; s/tronçon/arrêt/g' index.html
          perl -0pi -e 's/var WAIT_BUS = 8, WAIT_METRO = 5;/var WAIT_BUS = 10, WAIT_METRO = 5;/g; s/var WALK_SPEED_M_MIN = 83\.3, DETOUR_FACTOR = 1\.3;/var WALK_SPEED_M_MIN = 83.3, DETOUR_FACTOR = 1.45;/g' index.html
      - name: Add Cascavelle routing module
        run: perl -0pi -e 's#(<script>\n\(function\(\)\{)#<script src="cascavelle-fix.js"></script>\n$1#' index.html
      - name: Add stable UI and routing modules
        run: perl -0pi -e 's#</body>#<script src="search-ux.js"></script>\n<script src="route-network-fix.js"></script>\n<script src="search-cleanup.js"></script>\n<script src="v22-search.js"></script>\n<script src="v30-cleanup.js"></script>\n<script src="v30-map-location.js"></script>\n<script src="v30-search-selection.js"></script>\n<script src="v31-search-autocomplete.js"></script>\n</body>#' index.html
      - name: Inject route options and inline step details
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          patch = Path('v18-route-options.js').read_text(encoding='utf-8') + '\n' + Path('v20-ui.js').read_text(encoding='utf-8') + '\n' + Path('v21-ui.js').read_text(encoding='utf-8')
          pos = html.rfind('</script>')
          if pos < 0:
              raise SystemExit('Could not find main application script')
          html = html[:pos] + '\n' + patch + html[pos:]
          Path('index.html').write_text(html, encoding='utf-8')
      - name: Verify v3.0 changes
        run: |
          grep -q 'SegaMap v3.0' index.html
          test -s cascavelle-fix.js
          test -s route-network-fix.js
          test -s v18-route-options.js
          test -s v20-ui.js
          test -s v21-ui.js
          test -s v22-search.js
          test -s v30-cleanup.js
          test -s v30-map-location.js
          test -s v30-search-selection.js
          test -s v31-search-autocomplete.js
          grep -q 'v30-cleanup.js' index.html
          grep -q 'v22-search.js' index.html
          grep -q 'v31-search-autocomplete.js' index.html
          grep -q 'v30-search-selection.js' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
